<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Series A Broker</title>

  <script src="https://s3.tradingview.com/tv.js"></script>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#0d1117;
      color:white;
    }

    header{
      background:#161b22;
      padding:15px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      border-bottom:1px solid #222;
    }

    .logo{
      font-size:24px;
      font-weight:bold;
      color:#00ffae;
    }

    .balance{
      background:#00ffae;
      color:black;
      padding:8px 15px;
      border-radius:10px;
      font-weight:bold;
    }

    .container{
      padding:15px;
    }

    .card{
      background:#161b22;
      padding:15px;
      border-radius:15px;
      margin-bottom:15px;
    }

    .card h2{
      margin-bottom:10px;
      color:#00ffae;
    }

    input{
      width:100%;
      padding:12px;
      border:none;
      border-radius:10px;
      margin-top:10px;
      background:#0d1117;
      color:white;
    }

    button{
      width:100%;
      padding:12px;
      border:none;
      border-radius:10px;
      margin-top:10px;
      font-weight:bold;
      cursor:pointer;
      font-size:16px;
    }

    .buy{
      background:#00c853;
      color:white;
    }

    .sell{
      background:#ff1744;
      color:white;
    }

    .deposit{
      background:#2962ff;
      color:white;
    }

    #tv_chart_container{
      height:500px;
      margin-top:15px;
      border-radius:15px;
      overflow:hidden;
    }

    .footer{
      text-align:center;
      padding:20px;
      color:#777;
    }
  </style>
</head>
<body>

<header>
  <div class="logo">Series A Broker</div>
  <div class="balance">Balance: $10,000</div>
</header>

<div class="container">

  <div class="card">
    <h2>Live Chart</h2>

    <div id="tv_chart_container"></div>

    <script>
      new TradingView.widget({
        "width": "100%",
        "height": 500,
        "symbol": "BINANCE:BTCUSDT",
        "interval": "15",
        "timezone": "Asia/Jakarta",
        "theme": "dark",
        "style": "1",
        "locale": "id",
        "toolbar_bg": "#161b22",
        "enable_publishing": false,
        "hide_top_toolbar": false,
        "save_image": false,
        "container_id": "tv_chart_container"
      });
    </script>
  </div>

  <div class="card">
    <h2>Trading Panel</h2>

    <input type="number" placeholder="Masukkan Lot">

    <button class="buy">BUY</button>
    <button class="sell">SELL</button>
  </div>

  <div class="card">
    <h2>Deposit</h2>

    <input type="text" placeholder="Masukkan Jumlah Deposit">

    <button class="deposit">
      Deposit Sekarang
    </button>
  </div>

</div>

<div class="footer">
  © 2026 Series A Broker
</div>

</body>
</html>
